<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel del equipo de innovación</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#EDF4F7" />
    <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="pagina-panel">
    <main class="panel">
      <section class="panel-izq" aria-labelledby="titulo-panel">
        <img class="logo" src="assets/logos/unica-azul-marino.png" alt="UNICA" width="1080" height="424" />
        <h1 id="titulo-panel">El equipo de innovación del stand</h1>
        <p class="panel-mensaje">Un equipo de innovación necesita a los seis.</p>
        <div>
          <p class="total" id="total" aria-live="polite">0</p>
          <p class="total-texto" id="total-texto">futuros innovadores ya descubrieron su forma de innovar</p>
        </div>
        <div class="acceso">
          <div class="qr" id="qr" role="img" aria-label="Código QR para hacer el test"></div>
          <p>Escaneá y descubrí la tuya<small id="direccion"></small></p>
        </div>
      </section>
      <section class="panel-der" aria-label="Perfiles del equipo">
        <ul class="rejilla" id="rejilla"></ul>
        <div class="completo" id="completo" hidden>
          <div class="fila" id="fila-completo" aria-hidden="true"></div>
          <p>¡Ya tenemos al equipo completo!</p>
        </div>
        <p class="estado" id="estado" role="status"></p>
      </section>
    </main>
    <script type="module" src="js/panel.js"></script>
  </body>
</html>
